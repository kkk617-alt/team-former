# Supabase 무료 프로젝트가 일시정지되지 않게 매일 DB 에 질의를 보낸다.
# 공고 3장 "DB(Supabase)가 일시정지되지 않게" 의 어려운 해결.
#
# 쓰기 전에 할 일
#   깃허브 저장소 > Settings > Secrets and variables > Actions 에서
#   DATABASE_URL 이라는 이름으로 Supabase 풀러 주소를 넣는다.
#
# 주의
#   예약 실행은 워크플로 파일이 기본 브랜치(main 또는 master)에 있어야 돈다.
#   저장소에 60일 동안 활동이 없으면 깃허브가 예약 실행을 멈춘다.

name: DB 깨우기

on:
  schedule:
    # 매일 UTC 03:17 (한국 시각 12:17). 정시를 피해 적는 것이 권장된다.
    - cron: "17 3 * * *"
  # 손으로 한 번 돌려 볼 수 있게 한다
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: psycopg2 설치
        run: pip install "psycopg2-binary>=2.9,<3"

      - name: DB 에 질의
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python scripts/keepalive.py
